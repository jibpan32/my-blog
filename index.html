<!DOCTYPE html>
  <html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>私のブログ</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #f5f5f5; color: #333; }
        header { background: #2c3e50; color: white; padding: 2rem; text-align: center; }
    header h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    header p { opacity: 0.8; }
    main { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    .post-card { background: white; border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .post-card h2 { font-size: 1.4rem; margin-bottom: 0.5rem; }
    .post-card h2 a { color: #2c3e50; text-decoration: none; }
    .post-card h2 a:hover { color: #3498db; }
    .post-meta { color: #888; font-size: 0.85rem; margin-bottom: 1rem; }
    .post-excerpt { line-height: 1.7; color: #555; }
    .read-more { display: inline-block; margin-top: 1rem; color: #3498db; text-decoration: none; font-weight: bold; }
    footer { text-align: center; padding: 2rem; color: #888; font-size: 0.9rem; }
  </style>
    </head>
    <body>
      <header>
        <h1>私のブログ</h1>
        <p>日々の記録と思ったこと</p>
      </header>
      <main>
        <article class="post-card">
          <h2><a href="#">はじめての投稿</a></h2>
          <div class="post-meta">2026年5月15日</div>
          <p class="post-excerpt">ブログを始めました！これから日々の出来事や気づいたことを書いていきます。よろしくお願いします。</p>
          <a href="#" class="read-more">続きを読む →</a>
        </article>
      </main>
      <footer>
        <p>© 2026 私のブログ - Powered by Cloudflare Pages</p>
      </footer>
    </body>
    </html>
